[build-system]
requires = ["hatchling>=1.27"]  # 1.27+: SPDX license expressions (PEP 639)
build-backend = "hatchling.build"

[project]
name = "atlassian-cli-toolkit"
dynamic = ["version"]
description = "Command line toolkit for Atlassian Cloud (Jira), read-only by default, built on the official REST APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pietro Bertozzi" }]
keywords = ["atlassian", "jira", "cli", "jira-cloud", "rest-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "keyring>=25",
    "rich>=13",
    "tomli-w>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/pietro-bertozzi/atlassian-cli-toolkit"
Documentation = "https://github.com/pietro-bertozzi/atlassian-cli-toolkit/blob/main/docs/jira.md"
Issues = "https://github.com/pietro-bertozzi/atlassian-cli-toolkit/issues"
Changelog = "https://github.com/pietro-bertozzi/atlassian-cli-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
atl = "atlassian_toolkit.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/atlassian_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit a real Atlassian instance; run only when explicitly enabled",
]

[tool.mypy]
# Type hints are required everywhere (CLAUDE.md §8); this makes CI enforce them.
files = ["src"]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
