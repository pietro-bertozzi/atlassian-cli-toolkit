[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlassian-cli-toolkit"
dynamic = ["version"]
description = "Command line toolkit for Atlassian Cloud (Jira), read-only by default, built on the official REST APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pietro Bertozzi" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "keyring>=25",
    "rich>=13",
    "tomli-w>=1.2.0",
]

[project.scripts]
atl = "atlassian_toolkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/atlassian_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit a real Atlassian instance; run only when explicitly enabled",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
